name: pyincc_app
description: PYINCC - Hệ thống CSKH 2 tầng AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  before_after: ^3.1.0
  image_picker: ^1.1.2
  http: ^1.2.2
  image: ^4.2.0
  flutter_facebook_auth: ^7.1.1
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets_icon_1024.png
    - assets/brand/

flutter_native_splash:
  color: "#FFF5F5"
  image: assets/brand/splash.png
  android_12:
    image: assets/brand/splash.png
    color: "#FFF5F5"
    icon_background_color: "#FFF5F5"
