services:
  - type: web
    name: pyincc-meta-webhook
    runtime: node
    # Switch to "starter" for always-on production (avoids ~50s cold-start latency on Meta webhooks).
    plan: free
    rootDir: backend_bridge/meta-webhook
    # Switch to "npm ci" once backend_bridge/meta-webhook/package-lock.json is committed.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://pyincccrm.bothelper.vn
      - key: SUPABASE_URL
        value: https://ihufvqrxdswgbagzhydb.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: customer-media
      - key: META_APP_ID
        value: "1555273769742937"
      - key: META_GRAPH_API_VERSION
        value: v19.0
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: VERIFY_TOKEN
        generateValue: true
      - key: PAGE_TOKEN_ENC_KEY
        generateValue: true
