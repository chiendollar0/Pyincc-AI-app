name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend syntax
        run: node --check backend_bridge/meta-webhook/index.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile_app
        run: flutter test

      - name: Build debug APK
        working-directory: mobile_app
        env:
          ORG_GRADLE_PROJECT_FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRYON_API_URL: ${{ secrets.TRYON_API_URL }}
        run: |
          missing=""
          for var_name in ORG_GRADLE_PROJECT_FB_CLIENT_TOKEN SUPABASE_URL SUPABASE_ANON_KEY TRYON_API_URL; do
            if [ -z "${!var_name}" ]; then
              missing="$missing $var_name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Secrets:$missing"
            exit 1
          fi

          flutter build apk --debug \
            "--dart-define=SUPABASE_URL=$SUPABASE_URL" \
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            "--dart-define=TRYON_API_URL=$TRYON_API_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
