name: Release Pyincc AI CRM APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for leaked secrets
        run: |
          if git grep -nE "(AIza[0-9A-Za-z_-]{35}|EAAG[0-9A-Za-z]{20,}|sbp_[0-9a-f]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)" -- . ':!.github/workflows/*'; then
            echo "::error::Potential secret detected in tracked files!"
            exit 1
          fi

      - name: Setup Node.js & verify backend syntax
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check backend syntax & tests
        run: |
          node --check backend_bridge/meta-webhook/index.js
          node --test backend_bridge/meta-webhook/test/handoff_and_memberships.test.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: 'stable'
          cache: true

      - name: Decode Android Release Keystore (if configured)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 --decode > mobile_app/android/app/pyincc-release.jks
            cat <<EOF > mobile_app/android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=pyincc-release.jks
          EOF
          else
            echo "ANDROID_KEYSTORE_B64 not set; building release APK with fallback signing config."
          fi

      - name: Install dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ./mobile_app
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        working-directory: ./mobile_app
        run: flutter test

      - name: Build Release APK
        working-directory: ./mobile_app
        env:
          ORG_GRADLE_PROJECT_FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRYON_API_URL: ${{ secrets.TRYON_API_URL }}
        run: |
          missing=""
          for var_name in ORG_GRADLE_PROJECT_FB_CLIENT_TOKEN SUPABASE_URL SUPABASE_ANON_KEY TRYON_API_URL; do
            if [ -z "${!var_name}" ]; then
              missing="$missing $var_name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Secrets:$missing"
            exit 1
          fi

          flutter build apk --release \
            --dart-define=APP_ENV=production \
            "--dart-define=SUPABASE_URL=$SUPABASE_URL" \
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            "--dart-define=TRYON_API_URL=$TRYON_API_URL"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyincc-aicrm-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
